# SEC-GIT-001.yaml définit le contrôle des secrets dans Git. Les paramètres du DAGD précisent les exigences et particularités du projet audité.

identification:
  id: "SEC-GIT-001"
  nom: "Absence de secrets en clair dans Git"
  description: >
    Vérifier l'absence de secrets en clair dans le code
    et dans l'historique Git accessible du dépôt.

source_officielle:
  type: "Confluence"
  reference: null

perimetre:
  cible: "Dépôt Git"
  inclus:
    - "Fichiers actuellement présents dans le dépôt"
    - "Historique des commits accessible"

preuves_attendues:
  elements:
    - "Chemin du fichier concerné"
    - "Numéro de ligne, si disponible"
    - "Identifiant du commit, si applicable"
    - "Type de secret détecté"
  confidentialite:
    - "Ne jamais afficher ni enregistrer la valeur du secret en clair"

entrees_necessaires:
  - "Accès en lecture au dépôt Git"
  - "Historique Git accessible"
  - "Configuration de détection des secrets"

methode_verification:
  outil: "Gitleaks"
  orchestration: "Python"
  etapes:
    - "Analyser les fichiers actuels du dépôt"
    - "Analyser l'historique Git accessible"
    - "Récupérer les résultats structurés de Gitleaks"
    - "Normaliser les résultats"
    - "Masquer les valeurs sensibles avant journalisation ou transmission"
    - "Appliquer les critères de décision"

criteres_decision:
  conforme:
    condition: >
      Analyse terminée sur tout le périmètre défini,
      sans secret détecté, compte tenu des limites de l'outil.
  non_conforme:
    condition: "Présence d'un secret confirmée."
  a_analyser:
    condition: >
      Détection suspecte dont la nature ne peut pas
      être déterminée automatiquement.
  erreur_technique:
    condition: >
      Analyse impossible ou incomplète en raison
      d'une erreur technique.

constat_et_justification:
  elements:
    - "Statut du contrôle"
    - "Fichiers et lignes concernés, si disponibles"
    - "Identifiants des commits concernés, si applicables"
    - "Type de détection"
    - "Justification de la décision"
    - "Limites éventuelles de l'analyse"
  confidentialite:
    - "Ne jamais inclure de secret en clair dans le rapport"
